# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/ChatApp_byZunn}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# Tat Open Session in View de kiem soat truy van JPA trong Service.
spring.jpa.open-in-view=false



# Thoi han sua hoac xoa tin nhan (tinh bang phut)
chat.message.edit-delete-timeout-minutes=15

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true